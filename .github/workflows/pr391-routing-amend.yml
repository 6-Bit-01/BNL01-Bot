name: PR 391 routing amendment

on:
  push:
    branches:
      - agent/fix-daily-token-accounting

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  amend-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply route-aware Gemini amendment
        run: python tools/pr391_amend.py

      - name: Run focused routing and accounting tests
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests.test_gemini_routing_policy \
            tests.test_token_budget_accounting \
            tests.test_async_relay_offload \
            tests.test_memory_preview_bot_path \
            tests.test_route_memory_governance \
            2>&1 | tee /tmp/pr391-focused-tests.log
          status=${PIPESTATUS[0]}
          echo "focused_test_status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Run full repository checks
        run: make check PYTHON=python

      - name: Commit verified amendment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make Gemini routing route-aware and protect Journal capacity'
          git push origin HEAD:agent/fix-daily-token-accounting

      - name: Report success on PR 391
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh pr comment 391 --body "Routing amendment applied and verified at \`$sha\`. Focused routing/accounting tests and the full repository check passed on Python 3.12. Temporary workflow cleanup and normal Python 3.9/3.12 CI remain next. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report failure on PR 391
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'The automated routing amendment did not commit because an assertion or test failed. No routing amendment was pushed.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '<details><summary>Focused-test failure tail</summary>'
            echo
            echo '```text'
            if [ -f /tmp/pr391-focused-tests.log ]; then
              tail -n 160 /tmp/pr391-focused-tests.log
            else
              echo 'Focused-test log was not created; failure occurred before that step.'
            fi
            echo '```'
            echo '</details>'
          } > /tmp/pr391-failure-comment.md
          gh pr comment 391 --body-file /tmp/pr391-failure-comment.md
