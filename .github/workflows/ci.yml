name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify source and tests
        run: make check PYTHON=python

  tiktok-live-transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use isolated transport Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/tiktok-live-ingest/requirements.txt

      - name: Install pinned signerless transport dependency
        run: >-
          python -m pip install --disable-pip-version-check
          -r tools/tiktok-live-ingest/requirements.txt

      - name: Verify upstream transport import contract
        run: >-
          python -c "from piratetok_live import EventType, TikTokLiveClient;
          assert EventType.chat == 'chat'; assert callable(TikTokLiveClient)"

      - name: Verify shadow transport and adapter tests
        run: |
          python -m compileall -q bnl_tiktok_live_chat.py scripts tests
          python -m unittest discover -s tests -p 'test_*tiktok_live*.py'

      - name: Verify scheduler scripts and systemd units
        run: |
          bash -n \
            scripts/run_tiktok_live_chat_shadow_window.sh \
            scripts/tiktok_live_chat_shadow_service.sh
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp deploy/systemd/bnl-tiktok-chat-shadow.service "$tmpdir/"
          cp deploy/systemd/bnl-tiktok-chat-shadow.timer "$tmpdir/"
          sed -i "s#/home/ubuntu/bnl01#$PWD#g" \
            "$tmpdir/bnl-tiktok-chat-shadow.service"
          systemd-analyze verify \
            "$tmpdir/bnl-tiktok-chat-shadow.service" \
            "$tmpdir/bnl-tiktok-chat-shadow.timer"
          systemd-analyze calendar \
            'Fri *-*-* 18:50:00 America/Los_Angeles' \
            | grep -F 'Normalized form: Fri *-*-* 18:50:00 America/Los_Angeles'
